[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning-for-java-developers"
version = "0.1.0"
description = "Executable Agent engineering course for Java developers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "openai==3.16.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "mcp==2.2.0",
  "rank-bm25==0.2.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mypy==2.3.1", "ruff==0.16.8", "hypothesis==6.168.0"]

[tool.setuptools]
py-modules = ["exercise_support"]

[tool.setuptools.packages.find]
include = ["capstone*", "tools*", "agent_lab*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "capstone"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true

[tool.mypy]
python_version = "3.12"
files = ["agent_lab", "tools"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
